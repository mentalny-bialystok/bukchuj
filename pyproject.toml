[project]
name = "value-engine"
version = "0.1.0"
description = "Paper-trading sports betting value engine: de-vig sharp odds, find soft-book value, Kelly staking, CLV tracking."
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ve = "value_engine.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["value_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
